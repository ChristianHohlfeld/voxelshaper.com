name: Orbit cube icon
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orbit-cube-icon.py'
      - '.github/workflows/orbit-cube-icon.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/orbit-cube-icon.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat: isometric cube on orbit/view toggle"
          git push
