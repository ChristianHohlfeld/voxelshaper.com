name: Overlays brush top
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/overlays-brush-top.py'
      - '.github/workflows/overlays-brush-top.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/overlays-brush-top.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: brush overlay top, view/draw overlay bottom"
          git push
