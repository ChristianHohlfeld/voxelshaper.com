name: Hub launch modelId first
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hub-launch-modelid.py'
      - '.github/workflows/hub-launch-modelid.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/hub-launch-modelid.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: open catalog modelId before hub autosave"
          git push
