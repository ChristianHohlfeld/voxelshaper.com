name: Test Box3D Physics

on:
  workflow_dispatch:
  push:
    paths:
      - 'physics/box3d_bridge.c'
      - 'physics-box3d-runtime.js'
      - 'physics-controls.js'
      - 'physics-mobile-cycle.js'
      - 'lib/box3d/box3d.js'
      - 'lib/box3d/box3d.wasm'
      - 'tests/e2e/box3d-physics.spec.mjs'
      - '.github/workflows/test-box3d-physics.yml'
      - 'index.html'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify generated physics assets
        run: |
          test -s lib/box3d/box3d.js
          test -s lib/box3d/box3d.wasm
          node --check physics-box3d-runtime.js
          node --check physics-mobile-cycle.js
          grep -q '<script src="lib/box3d/box3d.js"></script>' index.html
          grep -q '<script src="physics-box3d-runtime.js"></script>' index.html
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/voxelshaper-http.log 2>&1 &
          echo $! >/tmp/voxelshaper-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/voxelshaper-http.log
          exit 1
      - name: Run Box3D browser tests
        env:
          VS_TEST_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/box3d-physics.spec.mjs --project=chromium --reporter=line
