name: Test Editor Core + Box3D

on:
  workflow_dispatch:
  push:
    paths:
      - 'physics/box3d_bridge.c'
      - 'physics-box3d-runtime.js'
      - 'physics-runtime-hardening.js'
      - 'physics-input-router.js'
      - 'physics-controls.js'
      - 'physics-visuals.js'
      - 'history-hardening.js'
      - 'morph-forms-v2.js'
      - 'mcp-import.js'
      - 'examples/physics-pendulum.json'
      - 'lib/box3d/box3d.js'
      - 'lib/box3d/box3d.wasm'
      - 'tests/e2e/box3d-physics.spec.mjs'
      - 'tests/e2e/box3d-mobile-touch.spec.mjs'
      - 'tests/e2e/history-morph.spec.mjs'
      - '.github/workflows/test-box3d-physics.yml'
      - 'index.html'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify generated editor assets
        run: |
          test -s lib/box3d/box3d.js
          test -s lib/box3d/box3d.wasm
          node --check physics-box3d-runtime.js
          node --check physics-runtime-hardening.js
          node --check physics-input-router.js
          node --check physics-controls.js
          node --check physics-visuals.js
          node --check history-hardening.js
          node --check morph-forms-v2.js
          node --check mcp-import.js
          grep -q '<script src="lib/box3d/box3d.js"></script>' index.html
          grep -q '<script src="physics-box3d-runtime.js"></script>' index.html
          grep -q '<script src="history-hardening.js"></script>' index.html
          grep -q '<script src="physics-runtime-hardening.js"></script>' index.html
          grep -q '<script src="physics-input-router.js"></script>' index.html
          grep -q '<script src="physics-visuals.js"></script>' index.html
          grep -q '<script src="morph-forms-v2.js"></script>' index.html
          ! grep -q '<script src="gyro-navigation.js"></script>' index.html
          ! grep -q '<script src="physics-mobile-cycle.js"></script>' index.html
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/voxelshaper-http.log 2>&1 &
          echo $! >/tmp/voxelshaper-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/voxelshaper-http.log
          exit 1
      - name: Run local browser tests
        env:
          VS_TEST_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/box3d-physics.spec.mjs tests/e2e/box3d-mobile-touch.spec.mjs tests/e2e/history-morph.spec.mjs --reporter=line
      - name: Wait for live deployment
        run: |
          for i in {1..90}; do
            html="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' 'https://voxelshaper.com/?editor_ci=1' || true)"
            if printf '%s' "$html" | grep -q 'physics-box3d-runtime.js' \
              && printf '%s' "$html" | grep -q 'physics-runtime-hardening.js' \
              && printf '%s' "$html" | grep -q 'physics-input-router.js' \
              && printf '%s' "$html" | grep -q 'history-hardening.js' \
              && printf '%s' "$html" | grep -q 'morph-forms-v2.js' \
              && ! printf '%s' "$html" | grep -q 'gyro-navigation.js' \
              && ! printf '%s' "$html" | grep -q 'physics-mobile-cycle.js'; then
              exit 0
            fi
            sleep 2
          done
          echo 'live deployment did not expose current play-only physics scripts'
          exit 1
      - name: Run live browser tests
        env:
          VS_TEST_BASE_URL: https://voxelshaper.com
        run: npx playwright test tests/e2e/box3d-physics.spec.mjs tests/e2e/box3d-mobile-touch.spec.mjs tests/e2e/history-morph.spec.mjs --reporter=line
