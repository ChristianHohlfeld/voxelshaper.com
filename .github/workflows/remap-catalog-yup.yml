name: Remap catalog Z-up in editor
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/remap-catalog-yup.py'
      - '.github/workflows/remap-catalog-yup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/remap-catalog-yup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: stand catalog models Y-up in editor"
          git push
