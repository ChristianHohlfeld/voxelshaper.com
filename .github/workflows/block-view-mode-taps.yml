name: Block view-mode taps
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/block-view-mode-taps.py'
      - '.github/workflows/block-view-mode-taps.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/block-view-mode-taps.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: View mode must not place voxels on tap"
          git push
