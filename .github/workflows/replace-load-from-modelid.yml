name: Replace modelId loader
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/replace-load-from-modelid.py'
      - '.github/workflows/replace-load-from-modelid.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/replace-load-from-modelid.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: load hub models through applyHubImportProject"
          git push
