name: Inject editor extensions
on:
  workflow_dispatch:
  push:
    paths:
      - 'morph-forms-v2.js'
      - 'physics-controls.js'
      - 'physics-mobile-cycle.js'
      - 'scripts/inject-morph-v2.py'
      - '.github/workflows/inject-morph-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inject-morph-v2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat: inject editor extension scripts"
          git push
