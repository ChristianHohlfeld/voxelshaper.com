name: Inject mcp-import.js

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inject-mcp-import.yml'
      - 'mcp-import.js'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert script tag before </body> if missing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="mcp-import.js" defer></script>'
          if 'mcp-import.js' in text:
              print('already injected')
              raise SystemExit(0)
          if '</body>' not in text:
              raise SystemExit('no </body> in index.html')
          text = text.replace('</body>', tag + '\n</body>', 1)
          p.write_text(text, encoding='utf-8')
          print('injected')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat: load mcp-import.js in editor"
          git push
