name: Rename DRUCKEN to Print

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rename-drucken.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace label in index.html only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if 'DRUCKEN' not in text:
              print('DRUCKEN not found; nothing to do')
              raise SystemExit(0)
          # keep file otherwise untouched
          n = text.count('DRUCKEN')
          p.write_text(text.replace('>DRUCKEN</button>', '>Print</button>').replace('DRUCKEN', 'Print'), encoding='utf-8')
          print(f'replaced {n} occurrence(s)')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo no change
            exit 0
          fi
          git commit -m "ui: rename DRUCKEN button to Print"
          git push
