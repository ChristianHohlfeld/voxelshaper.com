name: Test Mobile Gyro Navigation

on:
  workflow_dispatch:
  push:
    paths:
      - 'gyro-navigation.js'
      - 'tests/e2e/gyro-navigation.spec.mjs'
      - 'scripts/inject-morph-v2.py'
      - 'index.html'
      - '.github/workflows/test-gyro-navigation.yml'

permissions:
  contents: read

jobs:
  gyro:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Chromium test runtime
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify gyro asset
        run: |
          node --check gyro-navigation.js
          grep -q '<script src="gyro-navigation.js"></script>' index.html
      - name: Start local editor
        run: |
          python3 -m http.server 4173 >/tmp/gyro-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/gyro-http.log
          exit 1
      - name: Test gyro navigation locally
        env:
          VS_TEST_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/gyro-navigation.spec.mjs --reporter=line
      - name: Confirm live asset
        run: |
          for i in {1..60}; do
            html="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' 'https://voxelshaper.com/?gyro_ci=1' || true)"
            if printf '%s' "$html" | grep -q 'gyro-navigation.js'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Test gyro navigation live
        env:
          VS_TEST_BASE_URL: https://voxelshaper.com
        run: npx playwright test tests/e2e/gyro-navigation.spec.mjs --reporter=line
