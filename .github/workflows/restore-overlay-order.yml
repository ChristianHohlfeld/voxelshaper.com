name: Restore overlay order
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/restore-overlay-order.py'
      - '.github/workflows/restore-overlay-order.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore-overlay-order.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: brush overlay low, mode toggle high"
          git push
