name: Add mobile canvas mode toggle
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/add-mobile-canvas-mode.py'
      - '.github/workflows/add-mobile-canvas-mode.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add-mobile-canvas-mode.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat: mobile view/edit toggle above color control"
          git push
