name: One undo step per stroke
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix-undo-stroke-commit.py'
      - '.github/workflows/fix-undo-stroke-commit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-undo-stroke-commit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: undo a whole stroke instead of mid-drag slices"
          git push
