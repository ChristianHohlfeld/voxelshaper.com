name: Swap mobile color and mode toggle
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/swap-mobile-color-mode.py'
      - '.github/workflows/swap-mobile-color-mode.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/swap-mobile-color-mode.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: swap mobile color picker and mode toggle"
          git push
