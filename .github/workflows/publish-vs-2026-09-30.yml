name: Publish vs-2026-09-30
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          TAG=vs-2026-09-30
          SHA=$(git rev-parse HEAD)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          if gh release create "$TAG" --target "$SHA" --title "VoxelShaper Suite 2026-09-30 — Editor" --notes "Editor commit \`$SHA\`."; then
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release appeared during create"
            exit 0
          fi
          echo "could not create or view $TAG" >&2
          exit 1
