name: Force mobile overlay swap
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/force-overlay-swap.py'
      - '.github/workflows/force-overlay-swap.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/force-overlay-swap.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: mobile overlays \u2014 color above, view/draw below"
          git push
