name: Fix remap syntax
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix-remap-syntax.py'
      - '.github/workflows/fix-remap-syntax.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-remap-syntax.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: restore applyHubImportProject parse"
          git push
